kind = "web"
previewPath = "/"
title = "Monad Tip Jar"
version = "1.0.0"
id = "artifacts/tip-jar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24980

[services.development]
run = "pnpm --filter @workspace/tip-jar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tip-jar", "run", "build" ]
run = "pnpm --filter @workspace/tip-jar run start"

[services.env]
PORT = "24980"
